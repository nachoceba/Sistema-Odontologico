# Modo demo (DD-106): nginx sirve solo archivos estaticos; la API se llama directo (CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Un archivo con extension que no existe es un 404 real, no la pagina de inicio.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # Rutas de la SPA (/agenda, /pacientes...): vuelven a index.html al recargar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
