# Entorno de desarrollo: `docker compose up` levanta los siete servicios (spec local-environment).
# Requiere un .env en la raiz (copiar de .env.example). db y redis NO publican puertos.

x-backend: &backend
  build: ./backend
  env_file: .env
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./.env.example:/.env.example:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *backend
    command: ["celery", "-A", "app.infrastructure.tasks.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_healthy

  beat:
    <<: *backend
    command:
      - celery
      - -A
      - app.infrastructure.tasks.celery_app
      - beat
      - --loglevel=INFO
      - -s
      - /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    # Sin env_file: solo VITE_API_URL llega al frontend (ningun secreto).
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  pgdata:
